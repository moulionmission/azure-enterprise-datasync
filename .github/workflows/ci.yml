name: .NET Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test .NET Solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore AzureEnterpriseDataSync.sln

      - name: Build Solution
        run: dotnet build AzureEnterpriseDataSync.sln --no-restore -c Release

      - name: Run xUnit Tests
        run: dotnet test AzureEnterpriseDataSync.sln --no-build -c Release --verbosity normal
